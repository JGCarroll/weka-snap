name: weka
base: core26
version: '3.8.7'
summary: The workbench for machine learning
license: GPL-3.0
description: |
  Weka is free machine learning software provided by the University of Waikato, New Zealand.
  It is a cross platform framework that enables a wide variety of statistical modelling and deep learning.
  One of the major features of Weka is a high quality GUI to enable generating and evaluating models without having to write a single line of code.
  This build is unofficially provided to provide a convienient installation format via Snapcraft.
  Official builds may be downloaded at https://www.cs.waikato.ac.nz/ml/weka/
grade: stable
confinement: strict
compression: lzo

parts:
  weka:
    plugin: maven
    source: https://git.cms.waikato.ac.nz/weka/weka.git
    source-type: git
    source-commit: 7f3f591dc178d3d057a3cc3c53f18f51c28d6fed # 3.8.7
    source-subdir: weka
    build-environment:
      - JAVA_HOME: '/usr/lib/jvm/java-1.25.0-openjdk-amd64/'
    maven-parameters:
      - -DskipTests=true
      - -Dgpg.skip=true
    build-packages:
      - maven
      - openjdk-25-jdk
    stage-packages:
      - openjdk-25-jre

apps:
  weka:
    command: bin/java weka.gui.GUIChooser
    environment:
      JAVA_OPTS: -Xms512m -Xmx8192m --enable-native-access=ALL-UNNAMED --enable-native-access=javafx.graphics
      CLASSPATH: $SNAP/jar/*
    extensions: [gnome]
    plugs:
      - network
      - home
