name: Build the snap

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: canonical/action-build@v1
      id: build
    - uses: actions/upload-artifact@v7
      with:
        archive: false
        path: ${{ steps.build.outputs.snap }}
